# Development stack: 3 containers (app, mysql, redis). Nothing starts with the machine (restart "no").
# `app` runs `php artisan dev`: web server, queue worker, log tail (Pail) and Vite in one container.
# Source (including vendor/ and node_modules/) is bind-mounted from the host (Linux only).
# Host ports come from .env (APP_PORT, VITE_PORT, MYSQL_FORWARD_PORT, REDIS_FORWARD_PORT).
name: bi-ygk

services:
    app:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: bi-ygk-dev
        container_name: bi-ygk-app
        restart: 'no'
        command: php artisan dev
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - pnpm_store:/home/app/.pnpm-store
            # ~/.cache keeps `pnpm dlx @laravel/multiplex` (used by `php artisan dev`) across container recreates.
            - app_cache:/home/app/.cache
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
            # php artisan serve
            SERVER_HOST: 0.0.0.0
            SERVER_PORT: 8000
            # Vite listens on the same port inside and outside so the hot-file URL works in the browser.
            VITE_HOST: 0.0.0.0
            VITE_PORT: ${VITE_PORT}
            VITE_DEV_SERVER_ORIGIN: http://localhost:${VITE_PORT}
            CHOKIDAR_USEPOLLING: ${VITE_USE_POLLING:-false}
            npm_config_store_dir: /home/app/.pnpm-store
        ports:
            - '${APP_PORT}:8000'
            - '${VITE_PORT}:${VITE_PORT}'
        healthcheck:
            test:
                ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/up > /dev/null']
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 20s
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        container_name: bi-ygk-mysql
        restart: 'no'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - '127.0.0.1:${MYSQL_FORWARD_PORT}:3306'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        container_name: bi-ygk-redis
        restart: 'no'
        command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - '127.0.0.1:${REDIS_FORWARD_PORT}:6379'
        healthcheck:
            test:
                ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    mysql_data:
    pnpm_store:
    app_cache:
